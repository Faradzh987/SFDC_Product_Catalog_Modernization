<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFDC Product Catalog Modernization</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f3f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid #dddbda;border-radius:8px;padding:32px;max-width:520px;width:100%;text-align:center}
.logo{width:48px;height:48px;background:#0070d2;border-radius:10px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
h1{font-size:18px;font-weight:700;color:#16325c;margin-bottom:8px}
p{font-size:13px;color:#706e6b;margin-bottom:24px;line-height:1.6}
.btn{display:block;padding:12px 24px;background:#0070d2;color:#fff;text-decoration:none;border-radius:4px;font-size:14px;font-weight:600;margin-bottom:10px}
.btn:hover{background:#005fb2}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600;margin:2px}
.b-green{background:#e3f5e3;color:#2e7d32}
.b-blue{background:#e0f0ff;color:#0070d2}
.b-red{background:#fde8e8;color:#c23934}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
  </div>
  <h1>SFDC Product Catalog Modernization</h1>
  <p>CoreSite Salesforce product catalog — current state vs future state. Toggle between 50+ fragmented product codes and a clean 3-step guided workflow.</p>
  <a href="salesforce-branch-circuit-mockup.html" class="btn">Open Product Catalog Mockup →</a>
  <div style="margin-top:16px">
    <span class="tag b-red">Current: 50+ product codes</span>
    <span class="tag b-green">Future: 3 core products</span>
    <span class="tag b-blue">3-step workflow</span>
  </div>
</div>
</body>
</html>
