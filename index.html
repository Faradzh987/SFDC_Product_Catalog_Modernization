<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFDC Product Catalog Modernization</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#032D60;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:60px 60px}
.bg-circle{position:absolute;border-radius:50%;opacity:0.06}
.c1{width:500px;height:500px;background:#0070d2;top:-150px;right:-150px;animation:float 8s ease-in-out infinite}
.c2{width:350px;height:350px;background:#4f8ef7;bottom:-100px;left:-80px;animation:float 6s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.card{position:relative;z-index:10;text-align:center;padding:64px 80px}
.sf-logo{width:64px;height:64px;background:#0070d2;border-radius:14px;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(0,112,210,0.5)}
.eyebrow{font-size:12px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:16px}
h1{font-size:38px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px;letter-spacing:-0.02em}
h1 span{color:#4f9eff}
.team{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:40px}
.btn-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;padding:14px 28px;border-radius:6px;font-size:14px;font-weight:700;transition:all 0.2s;border:2px solid}
.btn-primary{background:#0070d2;color:#fff;border-color:#0070d2}
.btn-primary:hover{background:transparent;color:#4f9eff;border-color:#4f9eff;transform:translateY(-2px)}
.btn-secondary{background:transparent;color:rgba(255,255,255,0.75);border-color:rgba(255,255,255,0.2)}
.btn-secondary:hover{background:rgba(255,255,255,0.06);color:#fff;border-color:rgba(255,255,255,0.5);transform:translateY(-2px)}
.btn-dark{background:#16325c;color:#fff;border-color:#16325c}
.btn-dark:hover{background:transparent;color:#8eb8ff;border-color:#8eb8ff;transform:translateY(-2px)}
.btn svg{transition:transform 0.2s}
.btn:hover svg{transform:translateX(4px)}
.divider{width:1px;height:32px;background:rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="grid"></div>
<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="card">
  <div class="sf-logo">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
  </div>
  <div class="eyebrow">CoreSite · Product Team</div>
  <h1>Salesforce Product<br><span>Catalog Modernization</span></h1>
  
  <div class="btn-row">
    <a href="salesforce-branch-circuit-mockup.html" class="btn btn-primary">
      📦 Product Catalog
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <div class="divider"></div>
    <a href="vendor-portal-external.html" class="btn btn-secondary">
    🏗 Vendor Portal (External)
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
  <div class="divider"></div>
  <a href="vendor-management-portal.html" class="btn btn-dark">
      🏢 Vendor Management (Internal)
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
</div>
</body>
</html>
